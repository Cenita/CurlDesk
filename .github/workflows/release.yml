name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Build Windows executable
        run: .\build.ps1

      - name: Create GitHub Release and upload executable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $releaseBody = @{
            tag_name = $env:RELEASE_TAG
            name = "CurlDesk $env:RELEASE_TAG"
            generate_release_notes = $true
            draft = $false
            prerelease = $false
          } | ConvertTo-Json

          $release = Invoke-RestMethod `
            -Method Post `
            -Uri "$env:API_URL/repos/$env:REPOSITORY/releases" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $releaseBody

          $uploadBase = ($release.upload_url -split "\{")[0]
          $checksum = Get-FileHash ".\dist\CurlDesk.exe" -Algorithm SHA256
          "$($checksum.Hash)  CurlDesk.exe" | Set-Content ".\dist\CurlDesk.exe.sha256" -NoNewline

          foreach ($asset in @("CurlDesk.exe", "CurlDesk.exe.sha256")) {
            Invoke-RestMethod `
              -Method Post `
              -Uri "$uploadBase`?name=$asset" `
              -Headers $headers `
              -ContentType "application/octet-stream" `
              -InFile ".\dist\$asset"
          }

          Write-Host "Published $($release.html_url) with dist\CurlDesk.exe"
